# School chatbot + Caddy (automatic HTTPS). See docs/deploy.md for every step.
#   docker compose up -d --build     start (or update after changing code)
#   docker compose ps                 both services should say "running" and the chatbot "(healthy)"
#   docker compose logs -f chatbot    see the server log
services:
  chatbot:
    build: .
    env_file: .env
    environment:
      DB_PATH: /app/data/chatbot.db
      FORWARDED_ALLOW_IPS: ${CADDY_IP:-172.30.0.2}   # only Caddy may say who the visitor is (tests/test_proxy_headers.py)
    volumes:
      - chatbot-data:/app/data          # the database and its backups; survives rebuilds
      - ./kb:/app/kb:ro                 # school content: replace files, then: docker compose restart chatbot
      - ./config:/app/config:ro
    expose:
      - "8000"                          # only Caddy can reach the app; it is not open to the internet directly
    networks:
      inside:
        ipv4_address: ${CHATBOT_IP:-172.30.0.3}
    restart: unless-stopped

  caddy:
    image: caddy:2.8.4
    ports:
      - "80:80"
      - "443:443"
    environment:
      CHATBOT_DOMAIN: ${CHATBOT_DOMAIN:?Set CHATBOT_DOMAIN in .env, for example chat.yourschool.in}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data                # HTTPS certificates
      - caddy-config:/config
    depends_on:
      - chatbot
    networks:
      inside:
        ipv4_address: ${CADDY_IP:-172.30.0.2}   # fixed, so the chatbot can trust exactly this address
    restart: unless-stopped

# A private network with fixed addresses. The chatbot must know Caddy's address in advance to trust the visitor
# address only from Caddy. If 172.30.0.0/24 is already used on the server, set CHATBOT_SUBNET, CADDY_IP and
# CHATBOT_IP in .env (both addresses inside the subnet, neither ending in .1, which Docker keeps for itself).
networks:
  inside:
    ipam:
      config:
        - subnet: ${CHATBOT_SUBNET:-172.30.0.0/24}

volumes:
  chatbot-data:
  caddy-data:
  caddy-config:
