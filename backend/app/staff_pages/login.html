<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff login</title>
<style>
  :root { color-scheme: light dark; --bg: #F2F4F8; --surface: #FFFFFF; --ink: #172033; --muted: #566178; --line: #D8DDE8; --accent: #1D3A6B; --on-accent: #FFFFFF; --gold: #E3A21A; --gold-soft: #FFF3D6; --bad: #B3261E; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0E1420; --surface: #172033; --ink: #E7ECF5; --muted: #9BA8BF; --line: #2A3650; --accent: #8DB1EE; --on-accent: #0E1420; --gold: #F0B73A; --gold-soft: #3A2F12; --bad: #FF8A80; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  form { width: 100%; max-width: 360px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 24px; }
  h1 { margin: 0 0 4px; font-size: 20px; }
  p { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  input { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); font: inherit; }
  button { margin-top: 14px; width: 100%; padding: 10px; border: 0; border-radius: 10px; background: var(--accent); color: var(--on-accent); font: inherit; font-weight: 600; cursor: pointer; }
  .msg { color: var(--bad); font-weight: 600; margin: 12px 0 0; min-height: 1em; }
  .demo { background: var(--gold-soft); border: 1px solid var(--gold); border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 700; display: inline-block; margin-bottom: 10px; }
</style>
</head>
<body>
  <form method="post" action="/staff/login">
    <span class="demo" {{demo_hidden}}>DEMO · dummy data</span>
    <h1>Staff login</h1>
    <p>School chatbot: enquiries, concerns and callbacks.</p>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
    <button type="submit">Log in</button>
    <p class="msg" role="alert">{{message}}</p>
  </form>
</body>
</html>
